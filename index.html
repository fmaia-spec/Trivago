<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/formulario.css">
    </link>
    <title>Document</title>
</head>

<body>
    <div class="container">
        <br>
        <img src="img1.png"><br><br><br>

        <form>
            <div class="from-control">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Nome" required>
            </div>

            <div class="from-control">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="E-mail" required />
            </div>


            <div class="from-control">
                <label for="text">Telefone:</label>
                <input type="text" id="text" placeholder="Telefone" required />
            </div>


            <div class="from-control">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Senha" required>
            </div>

            <div class="from-control">
                <label for="data">Data de nascimento</label>
                <input type="date" id="data" />
            </div>

            <div class="from-control">
                <label for="curso">Forma de pagamento</label>
                <select id="curso">
                    <option value="">Selecione</option>
                    <option value="informatica">crédito</option>
                    <option value="programacao">débito</option>
                    <option value="programacao">pix</option>
                    <option value="programacao">boleto</option>

                </select>
            </div>
            <br>
            <div class="from-control">
                <button type="submit" class="btn-cadastro">Cadastrar </button>
                <button type="reset" class="btn-limpar">Limpar</button>
            </div>
        </form>

    </div>

</body>

</html>
